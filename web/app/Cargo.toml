[package]
name = "tmovie-web"
version = "1.12.0"
edition = "2021"

[dependencies]
leptos = { version = "0.8", features = ["csr"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gloo-net = { version = "0.8", default-features = false, features = ["http", "json"] }
gloo-timers = { version = "0.3", features = ["futures"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
  "Window", "Document", "Element", "HtmlElement", "HtmlVideoElement", "HtmlMediaElement", "HtmlCanvasElement",
  "CanvasRenderingContext2d", "HtmlInputElement", "Storage", "Navigator", "PointerEvent", "Event", "EventTarget",
  "DomTokenList", "Location", "console", "ServiceWorkerContainer", "ScrollToOptions", "ScrollBehavior", "ShareData","DomRect","MouseEvent","KeyboardEvent","CssStyleDeclaration","TimeRanges","MediaQueryList","HtmlDivElement","ScrollIntoViewOptions","ScrollLogicalPosition","MediaError",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
