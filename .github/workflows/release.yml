name: Release APK (OTA)

# Builds the native mobile and Android TV APKs (Kotlin/Compose, android/ :app and :tv) and publishes
# them as one GitHub Release. Each app's OTA updater reads releases/latest and picks the APK whose
# name matches its package id ("mobile" / "tv"). The native TV app replaces the Flutter one (apps/tv):
# same package id and key, so it installs over it.
#
# Trigger:
#   - push a tag  v1.2.3            (git tag v1.2.3 && git push origin v1.2.3)
#   - or run manually (Actions tab) and type the version
#
# OTA update-installs require a CONSISTENT release key. Add these repo secrets
# (Settings > Secrets and variables > Actions) or builds fall back to the debug
# key (fine for a fresh install, but Android refuses update-installs across keys):
#   KEYSTORE_BASE64    base64 of your release.keystore  (base64 -i release.keystore | pbcopy)
#   KEYSTORE_PASSWORD  store password
#   KEY_ALIAS          key alias
#   KEY_PASSWORD       key password

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version, e.g. 1.2.3 (creates tag v1.2.3)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/private-core
        with:
          ssh-key: ${{ secrets.CORE_DEPLOY_KEY }}

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure release signing
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          # Same key as the old Flutter mobile app, so the native APK installs as an update over it.
          cat > android/key.properties <<EOF
          storeFile=$RUNNER_TEMP/release.keystore
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Restore Firebase config
        env:
          GS_MOBILE: ${{ secrets.GOOGLE_SERVICES_MOBILE }}
        run: |
          # google-services.json is gitignored (public repo), so the build restores it from a secret.
          printf '%s' "$GS_MOBILE" | base64 -d > android/app/google-services.json

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          V="${{ steps.ver.outputs.version }}"
          N="${{ github.run_number }}"
          # versionCode keeps using the run number, so it stays above the old Flutter builds.
          (cd android && ./gradlew :app:assembleRelease :tv:assembleRelease -PversionName="$V" -PversionCode="$N")

      - name: Stage APK
        run: |
          V="${{ steps.ver.outputs.version }}"
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/tmovie-mobile-v$V.apk"
          cp android/tv/build/outputs/apk/release/tv-release.apk "dist/tmovie-tv-v$V.apk"

      - name: Build release notes
        id: notes
        run: |
          # The in-app updater shows the release body as PLAIN TEXT, so we hand-write
          # human-readable notes in CHANGELOG.md and pull out the matching version
          # section here — never the lazy auto-generated commit list.
          V="${{ steps.ver.outputs.version }}"
          NOTES="$RUNNER_TEMP/release-notes.md"
          # Pull the Vietnamese in-app block (between the app:vi markers) of the
          # matching version — that is what users see in the update dialog.
          awk -v ver="## v$V" '
            $0 == ver {insec=1; next}
            insec && /^## v/ {exit}
            insec && /<!-- app:vi -->/ {invi=1; next}
            insec && /<!-- \/app:vi -->/ {invi=0; next}
            insec && invi {print}
          ' CHANGELOG.md | sed '/./,$!d' > "$NOTES"
          if [ ! -s "$NOTES" ]; then
            echo "::error::No CHANGELOG.md app:vi block found for v$V. Add a '## v$V' section with a <!-- app:vi --> block before releasing."
            exit 1
          fi
          echo "path=$NOTES" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: TMovie v${{ steps.ver.outputs.version }}
          body_path: ${{ steps.notes.outputs.path }}
          make_latest: true
          # TV first: old Flutter TV builds take the first .apk whose name has "tv".
          files: |
            dist/tmovie-tv-v${{ steps.ver.outputs.version }}.apk
            dist/tmovie-mobile-v${{ steps.ver.outputs.version }}.apk
