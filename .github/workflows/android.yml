name: Android

# Builds the native Kotlin/Compose app on every push / PR that touches android/:
# JVM tests for the core modules, then a debug APK uploaded as a workflow artifact.

on:
  push:
    paths: ['android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GS_MOBILE: ${{ secrets.GOOGLE_SERVICES_MOBILE }}
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # google-services.json is gitignored; without it the app still builds and hides sign-in.
      - name: Restore Firebase config
        if: env.GS_MOBILE != ''
        run: printf '%s' "$GS_MOBILE" | base64 -d > app/google-services.json

      - name: Unit tests
        run: ./gradlew :core:network:test --stacktrace

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: tmovie-android-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
