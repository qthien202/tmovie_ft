publish_to: 'none'
version: 1.0.1+2

resolution: workspace

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  core:
    path: ../../packages/core

  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1

  carousel_slider: ^5.1.2
  smooth_page_indicator: ^2.0.1

  video_player: ^2.10.1
  chewie: ^1.13.0
  shared_preferences: ^2.5.4
