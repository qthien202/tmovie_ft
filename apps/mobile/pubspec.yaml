name: mobile
description: TMovie mobile app
publish_to: 'none'
version: 1.0.0+1

resolution: workspace

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  core:
    path: ../../packages/core

  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1

  carousel_slider: ^5.1.2
  smooth_page_indicator: ^2.0.1
  google_nav_bar: ^5.0.7
  flutter_widget_from_html: ^0.17.1

  video_player: ^2.10.1
  chewie: ^1.13.0
  shared_preferences: ^2.5.4
  firebase_core: ^3.12.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/app_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/app_icon.png
